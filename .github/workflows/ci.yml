name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
            exe_suffix: ""
          - os: macos-latest
            artifact_name: macos
            exe_suffix: ""
          - os: windows-latest
            artifact_name: windows
            exe_suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build release
        run: cargo build --release --package arkama --bins --locked

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arkama-${{ matrix.artifact_name }}
          path: |
            target/release/arkama${{ matrix.exe_suffix }}
            target/release/arkama-cli${{ matrix.exe_suffix }}

  core-compatibility:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      matrix:
        features: ["", "serde", "native-tls,serde", "rustls-tls"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.features }}
      - name: Test core features on Rust 1.85
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test -p arkama_core --no-default-features --features '${{ matrix.features }}' --locked

  api-compatibility:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Test safe libraries and examples on Rust 1.85
        run: cargo test -p arkama_core -p arkama_data -p arkama_manager --all-targets --locked
      - name: Check API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p arkama_core -p arkama_data -p arkama_manager --no-deps --locked
