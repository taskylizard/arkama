[package]
name = "arkama_manager"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
description = "Persistent job management shared by Arkama hosts"

[dependencies]
arkama_core = { path = "../arkama_core" }
arkama_data = { path = "../arkama_data" }
bytefmt.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
eyre.workspace = true
fs2 = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
