[package]
name = "arkama"
version.workspace = true
edition.workspace = true

[[bin]]
name = "arkama"
path = "src/main.rs"

[dependencies]
arkama_core = { path = "../arkama_core" }
arkama_data = { path = "../arkama_data" }
bytefmt.workspace = true
clap.workspace = true
eframe = "0.27"
egui_extras = "0.27"
eyre.workspace = true
indicatif.workspace = true
notify-rust = "4"
rfd = "0.14"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap_complete = "4.5"
clap_complete_nushell = "4.5"
console = "0.15"
dialoguer = "0.11"
open = "5"
owo-colors = "4"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
