[workspace]
resolver = "2"
members = [
  "crates/arkama_core",
  "crates/arkama_data",
  "crates/arkama",
]

[workspace.package]
version = "0.2.0-rc3"
edition = "2024"

[workspace.dependencies]
bytefmt = "0.1"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
futures-util = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
